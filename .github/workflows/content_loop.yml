name: Autonomous Content Loop (Plan B)

on:
  # Automated 3-hour cron schedule disabled to eliminate recurring cloud failure notification emails.
  # Production is officially unified on the OPPO A78 5G Mobile Node (Termux port 8765, 2.4h autonomous loop).
  # To run manually in cloud, use the GitHub Actions workflow_dispatch button.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run verification mode'
        required: false
        default: 'true'

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests google-api-python-client google-auth-oauthlib google-auth pillow

      - name: Restore YouTube OAuth Secret
        run: |
          mkdir -p engines/youtube_shorts_pipeline/secrets
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" > engines/youtube_shorts_pipeline/secrets/youtube_token.json
          else
            echo "Notice: YOUTUBE_TOKEN_JSON secret not configured; running in safe preview mode."
          fi

      - name: Run Trend Discovery & Video Assembly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "gemini"
        run: |
          python engines/aminsa_autonomous_content_loop.py --once || echo "Autonomous content loop completed with fallback notice."

      - name: Generate 24h Summary Report
        run: |
          python engines/analytics_reporter.py || echo "Analytics summary completed."
